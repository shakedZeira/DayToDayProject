services:
  - type: web
    name: api
    runtime: image
    image: { source: Dockerfile, dockerfilePath: server/Dockerfile }
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dtd-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        fromService:
          type: web
          name: client
          property: url
      - key: LLM_HTTP_URL
        value: "https://api.groq.com/openai/v1/chat/completions"
      - key: LLM_MODEL
        value: "llama-3.1-8b-instant"
      - key: LLM_HTTP_KEY
        sync: false
      - key: VISION_PROVIDER
        value: "stub"
      - key: PORT
        value: 4000
    healthCheckPath: /api/health
    autoDeploy: true
  - type: web
    name: client
    runtime: image
    image: { source: Dockerfile, dockerfilePath: client/Dockerfile }
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: api
          property: host
databases:
  - name: dtd-db
    plan: free
