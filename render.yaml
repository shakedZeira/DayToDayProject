# Render free web service for the DayToDay API (server-only Docker image).
#
# Topology:
#   Neon (Postgres)  <-  Render (this API)  <-  Cloudflare Pages (static client,
#   proxies /api/* here via client/public/_redirects)
#
# Do NOT use Render's free Postgres (it expires after 30 days). Use Neon.
# Set DATABASE_URL (Neon pooled URL, with ?sslmode=require) in the Render
# dashboard after the first sync. Render's free tier sleeps after ~15 min idle;
# ping https://<your-app>.onrender.com/api/health every 10 min from cron-job.org.
services:
  - type: web
    name: dtd-api
    runtime: docker
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Your Cloudflare Pages URL (CORS is not exercised through the proxy, but set it anyway).
      - key: CLIENT_URL
        value: https://dtd.pages.dev
      - key: LLM_PROVIDER
        value: http
      - key: LLM_HTTP_URL
        value: https://api.groq.com/openai/v1/chat/completions
      - key: LLM_MODEL
        value: llama-3.1-8b-instant
      - key: LLM_HTTP_KEY
        sync: false
      - key: VISION_PROVIDER
        value: stub
