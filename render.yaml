services:
  - type: web
    name: api
    runtime: docker
    dockerfilePath: server/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dtd-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # CORS: the client nginx same-origins /api to http://api:4000, so the browser
      # never makes cross-origin calls and CORS isn't exercised. CLIENT_URL is left
      # unset so the server falls back to "*". (If you ever call the API directly,
      # set CLIENT_URL to your deployed client URL in the api Environment tab.)
      - key: LLM_HTTP_URL
        value: "https://api.groq.com/openai/v1/chat/completions"
      - key: LLM_MODEL
        value: "llama-3.1-8b-instant"
      - key: LLM_HTTP_KEY
        sync: false
      - key: VISION_PROVIDER
        value: "stub"
      - key: PORT
        value: 4000
    healthCheckPath: /api/health
    autoDeploy: true
  - type: web
    name: client
    runtime: docker
    dockerfilePath: client/Dockerfile
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: api
          property: host
databases:
  - name: dtd-db
    plan: free
