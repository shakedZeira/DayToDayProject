name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dtd
          POSTGRES_PASSWORD: dtd
          POSTGRES_DB: dtd
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dtd -d dtd"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://dtd:dtd@localhost:5432/dtd?schema=public
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema server/prisma/schema.prisma
      # No ESLint config exists in the repo yet, so lint is intentionally omitted.
      - run: npm run typecheck
      - run: npm test --workspace server
      - run: npm test --workspace client
      - run: npm run build
