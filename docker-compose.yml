services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dtd
      POSTGRES_PASSWORD: dtd
      POSTGRES_DB: dtd
    ports:
      - "5432:5432"
    volumes:
      - dtd_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dtd -d dtd"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  dtd_pgdata:
